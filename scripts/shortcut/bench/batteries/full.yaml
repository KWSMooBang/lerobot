# Full shortcut battery: the whole design (P2 of "LIBERO Shortcut Learning 관측 실험 설계" for one checkpoint).
# ours: C0–C6 × 4 suites × 50 inits, C0 repeated 3× (repeat 1, 2 measure C0-vs-C0 agreement / DTW baseline).
# LIBERO-Plus / LIBERO-PRO jobs are added by T012 / T013.
name: full
description: ours C0–C6 × 4 suites × 50 inits, C0 × 3 repeats
defaults:
  seed: 7
  video: "first:5"
  tasks: 0-9
  episodes: 50
jobs:
  - benchmark: ours
    suites: [libero_spatial, libero_object, libero_goal, libero_10]
    conditions: [C0]
    repeats: [0, 1, 2]
  - benchmark: ours
    suites: [libero_spatial, libero_object, libero_goal, libero_10]
    conditions: [C1, C2, C3, C4, C5, C6]
  # --- LIBERO-Plus (T012): all 7 axes × 4 suites. 20 registered variants per task (stratified over
  # difficulty levels; all of them where a task has fewer), init 0 = upstream protocol; clean baseline 10 inits.
  # Motion-blur noise variants run only with libMagickWand (apt libmagickwand-6.q16-6), else they are skipped.
  - benchmark: libero_plus
    suites: [libero_spatial, libero_object, libero_goal, libero_10]
    perturbations: [none]
    episodes: 10
  - benchmark: libero_plus
    suites: [libero_spatial, libero_object, libero_goal, libero_10]
    perturbations: [language, layout, camera, robot, lighting, texture, noise]
    variants: 20
    episodes: 1
  # LIBERO-PRO (T013): clean + all five axes × 4 suites × 50 inits (position: swap; libero_object also x/y
  # 0.1–0.5). The environment axis is generated by bench/libero_pro/setup_venv.sh (not in the PRO dataset).
  - benchmark: libero_pro
    suites: [libero_spatial, libero_object, libero_goal, libero_10]
    perturbations: [none, object, position, semantic, task, environment]
