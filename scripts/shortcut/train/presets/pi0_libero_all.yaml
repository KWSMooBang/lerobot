# π0 LIBERO from lerobot/pi0_base, openpi pi0_libero recipe (batch 32, 30k steps), the lerobot pi0 defaults
# otherwise (lr 2.5e-5, cosine to 2.5e-6, bf16, gradient checkpointing) — the same settings as the
# train_config.json of lerobot/pi0_libero_finetuned.
#
# effective batch and optimizer updates are fixed; sc-train derives batch/GPU x GPUs x grad accum for any
# GPU count (error if it does not divide). save_freq / log_freq below are in optimizer updates.
# GPUs        batch/GPU x GPUs x accum  lerobot --steps  expected time
# 4 A100-80G   8 x 4 x 1                30000            ~6-8 h (estimate, not measured here)
# 1 (GPU0)    32 x 1 x 1                30000            does not fit a 24 GB RTX 4090 (full fine-tune of ~3.5 B params)
description: pi0 LIBERO fine-tune from lerobot/pi0_base (openpi pi0_libero recipe)
policy_type: pi0
train_data: HuggingFaceVLA/libero
lerobot:
  policy.type: pi0
  policy.pretrained_path: lerobot/pi0_base
  policy.dtype: bfloat16
  policy.gradient_checkpointing: true
  policy.compile_model: true
  policy.compile_mode: max-autotune
  policy.optimizer_lr: 2.5e-5
  policy.scheduler_decay_lr: 2.5e-6
  policy.empty_cameras: 1
  policy.device: cuda
  seed: 1000
  num_workers: 8
  save_freq: 5000
  log_freq: 200
effective_batch: 32
optimizer_updates: 30000
micro_batch: 32
schedule: {warmup_frac: 0.0333}   # 1000 / 30000
estimate:
  params_b: 3.5
  mem_gb_per_gpu: 45
  hours_gpu0: null
  hours_a100x4: 7
