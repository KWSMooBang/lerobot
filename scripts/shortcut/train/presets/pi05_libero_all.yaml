# π0.5 LIBERO, same as lerobot's official run that produced lerobot/pi05_libero_finetuned (= ckpt pi05lib):
# its train_config.json: weights from lerobot/pi05_libero (features from the dataset + 1 empty camera, MEAN_STD), HuggingFaceVLA/libero, bf16, gradient checkpointing,
# torch.compile max-autotune, AdamW lr 2.5e-5 (betas 0.9/0.95, wd 0.01, clip 1.0), cosine warmup 1000 ->
# decay 6000 to 2.5e-6, 32/GPU x 8 GPUs = effective batch 256, 6000 optimizer steps, seed 1000.
# lerobot-train `--steps` counts micro-batches, so with grad accumulation steps and the schedule scale by it.
#
# GPUs       batch/GPU  accum  loop steps  effective batch  expected time
# 8 H100      32        1       6000       256              (official run)
# 4 A100-80G  32        2      12000       256              ~10-14 h (estimate, not measured here)
# 1 (GPU0)    -         -          -         -              does not fit a 24 GB RTX 4090 (full fine-tune of ~3.6 B params)
description: pi05 LIBERO fine-tune from lerobot/pi05_libero (official recipe of pi05_libero_finetuned)
policy_type: pi05
train_data: HuggingFaceVLA/libero
lerobot:
  policy.type: pi05
  policy.pretrained_path: lerobot/pi05_libero
  policy.empty_cameras: 1
  policy.normalization_mapping: {VISUAL: IDENTITY, STATE: MEAN_STD, ACTION: MEAN_STD}
  policy.dtype: bfloat16
  policy.gradient_checkpointing: true
  policy.compile_model: true
  policy.compile_mode: max-autotune
  policy.optimizer_lr: 2.5e-5
  policy.scheduler_decay_lr: 2.5e-6
  policy.device: cuda
  seed: 1000
  num_workers: 8
  save_freq: 2000
  log_freq: 200
scale:
  1: {batch: 32, grad_accum: 8, steps: 48000}
  4: {batch: 32, grad_accum: 2, steps: 12000}
  8: {batch: 32, grad_accum: 1, steps: 6000}
schedule: {warmup_frac: 0.1667}   # 1000 / 6000 optimizer steps, scaled to loop steps
estimate:
  params_b: 3.6
  mem_gb_per_gpu: 50  # bf16 weights+grads+AdamW ~26 GB + activations (grad ckpt); not measured
  hours_gpu0: null
  hours_a100x4: 12
